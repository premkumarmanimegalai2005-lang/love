<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love Account ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Video -->
    <video
        id="backgroundVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="./background.mp4" type="video/mp4">
    </video>

    <!-- Dark overlay -->
    <div class="video-overlay"></div>

    <!-- Login card -->
    <div class="container">

        <div class="card">

            <h1 id="formTitle">Login ❤️</h1>

            <p id="formDescription">
                Login to continue
            </p>

            <form id="authForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit" id="submitButton">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <div class="switch-area">
                <span id="switchText">
                    Don't have an account?
                </span>

                <button type="button" id="switchButton">
                    Create Account
                </button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
